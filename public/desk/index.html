<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Digital Demons NRFI</title>

<!-- iPhone: Share -> Add to Home Screen gives a full-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- The home-screen icon label, not the app name: iOS truncates it around 12
     characters, so the full name would read "Digital De...". Matches the
     manifest short_name for the same reason. -->
<meta name="apple-mobile-web-app-title" content="DD NRFI" />
<meta name="theme-color" content="#06080D" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="/desk/manifest.json" />
<link rel="apple-touch-icon" href="/desk/icon.svg" />

<style>
  /* Matches --slate-900 in app.jsx's .cd block. This is what iOS shows in the
     rubber-band overscroll gutter and behind the status bar, so it has to be
     kept in step with the theme by hand — the app's CSS never reaches here. */
  html, body { margin:0; padding:0; background:#06080D; min-height:100%; overflow-x:hidden; }
  #root { min-height:100vh; }
  #boot { color:#8E99B0; font:13px/1.5 ui-monospace, monospace; padding:40px 20px; text-align:center; }
  #rotate-overlay {
    display:none; position:fixed; inset:0; z-index:9999;
    background:#06080D; color:#8E99B0;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; font:14px/1.5 ui-monospace, monospace; text-align:center; padding:20px;
  }
  #rotate-overlay svg { opacity:.5; }
  @media (orientation:landscape) and (max-height:600px) {
    #rotate-overlay { display:flex; }
  }
</style>
</head>
<body>
  <div id="rotate-overlay">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="4" y="2" width="16" height="20" rx="2"/>
      <path d="M9 21h6"/>
    </svg>
    Rotate to portrait
  </div>
  <div id="root"><div id="boot">Starting Digital Demons NRFI…</div></div>

  <!-- If startup fails, say so instead of hanging on the boot line. -->
  <script>
    window.addEventListener("error", function (e) {
      var b = document.getElementById("boot");
      if (b) b.textContent = "Startup error: " + (e.message || (e.target && e.target.src) || "unknown") +
        " — screenshot this.";
    }, true);
    // Watchdog: if the app hasn't mounted in 8 seconds, self-heal once
    // (clear the app's local cache and reload — a stale cache from an old
    // build is the usual culprit), then say what to do instead of hanging.
    (function () {
      window.__deskMounted = false;
      setTimeout(function () {
        if (window.__deskMounted) return;
        try {
          if (!sessionStorage.getItem("cdheal")) {
            sessionStorage.setItem("cdheal", "1");
            var ks = [];
            for (var i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
            ks.forEach(function (k) { if (k && k.indexOf("cd:") === 0) localStorage.removeItem(k); });
            location.reload();
            return;
          }
        } catch (err) { /* storage blocked — fall through to the message */ }
        var b = document.getElementById("boot");
        if (b) b.textContent = "Still stuck after two tries — your phone is holding an old cached copy. " +
          "Fix: iPhone Settings > Apps > Safari > Advanced > Website Data > search 'fueltechaipro' > delete it, " +
          "then remove and re-add the home-screen icon.";
      }, 8000);
    })();
  </script>

  <!-- Precompiled at deploy time (scripts/desk-build.js); no CDN, no
       in-browser Babel — phones just run plain JavaScript. -->
  <script src="/desk/vendor/react.production.min.js"></script>
  <script src="/desk/vendor/react-dom.production.min.js"></script>
  <script src="/desk/app.js"></script>
</body>
</html>
