<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Contract Desk</title>

<!-- iPhone: Share -> Add to Home Screen gives a full-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Desk" />
<meta name="theme-color" content="#232A38" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="/desk/manifest.json" />
<link rel="apple-touch-icon" href="/desk/icon.svg" />

<style>
  html, body { margin:0; padding:0; background:#1B202B; min-height:100%; }
  #root { min-height:100vh; }
  #boot { color:#939CB0; font:13px/1.5 ui-monospace, monospace; padding:40px 20px; text-align:center; }
</style>
</head>
<body>
  <div id="root"><div id="boot">Starting Contract Desk…</div></div>

  <!-- If startup fails, say so instead of hanging on the boot line. -->
  <script>
    window.addEventListener("error", function (e) {
      var b = document.getElementById("boot");
      if (b) b.textContent = "Startup error: " + (e.message || (e.target && e.target.src) || "unknown") +
        " — screenshot this.";
    }, true);
    // Watchdog: if the app hasn't mounted in 8 seconds, self-heal once
    // (clear the app's local cache and reload — a stale cache from an old
    // build is the usual culprit), then say what to do instead of hanging.
    (function () {
      window.__deskMounted = false;
      setTimeout(function () {
        if (window.__deskMounted) return;
        try {
          if (!sessionStorage.getItem("cdheal")) {
            sessionStorage.setItem("cdheal", "1");
            var ks = [];
            for (var i = 0; i < localStorage.length; i++) ks.push(localStorage.key(i));
            ks.forEach(function (k) { if (k && k.indexOf("cd:") === 0) localStorage.removeItem(k); });
            location.reload();
            return;
          }
        } catch (err) { /* storage blocked — fall through to the message */ }
        var b = document.getElementById("boot");
        if (b) b.textContent = "Still stuck after two tries — your phone is holding an old cached copy. " +
          "Fix: iPhone Settings > Apps > Safari > Advanced > Website Data > search 'fueltechaipro' > delete it, " +
          "then remove and re-add the home-screen icon.";
      }, 8000);
    })();
  </script>

  <!-- Precompiled at deploy time (scripts/desk-build.js); no CDN, no
       in-browser Babel — phones just run plain JavaScript. -->
  <script src="/desk/vendor/react.production.min.js"></script>
  <script src="/desk/vendor/react-dom.production.min.js"></script>
  <script src="/desk/app.js"></script>
</body>
</html>
